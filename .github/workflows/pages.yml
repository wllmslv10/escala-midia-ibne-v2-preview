name: Publicar somente prévia estática fictícia no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar apenas interface React com dados fictícios
        run: |
          npm install --no-audit --no-fund --ignore-scripts --no-package-lock
          npm run build
          test -s dist/index.html
      - name: Bloquear integrações e credenciais no pacote
        run: |
          set -euo pipefail
          if grep -RE '(/api/auth/(login|me|logout)|SESSION_SECRET|HYPERDRIVE|firebaseConfig|DATABASE_URL)' dist --include='*.js'; then
            echo 'Erro: artefato não é estritamente estático.'
            exit 1
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar apenas arquivos estáticos do Pages
        id: deployment
        uses: actions/deploy-pages@v4
